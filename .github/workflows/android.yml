on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && 'RELEASE_ENVIRONMENT' || 'CI' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          problem-matcher: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan>=2,<3"
          conan --version

      - name: Detect Conan build profile
        run: conan profile detect --force

      - name: Set version environment variables
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$TAG_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(\.[0-9]+)?$ ]]; then
            echo "Error: Release tag must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH.BUILD"
            exit 1
          fi
          BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          if (( BUILD_NUMBER > 999 )); then
            echo "Error: GitHub Actions build number $BUILD_NUMBER exceeds the supported version component range (0-999)"
            exit 1
          fi
          RELEASE_VERSION="${BASH_REMATCH[1]}.$BUILD_NUMBER"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
          echo "RELEASE_VERSION_NAME=$RELEASE_VERSION" >> $GITHUB_ENV

      - name: Set dev version environment variables
        if: github.event_name != 'release'
        run: |
          echo "RELEASE_VERSION=0.0.0.${{ github.run_number }}" >> $GITHUB_ENV
          echo "RELEASE_VERSION_NAME=0.0.0.${{ github.run_number }}-$(echo "${GITHUB_REF_NAME}" | tr '/' '-')-$(git rev-parse --short HEAD)-dev" >> $GITHUB_ENV

      - name: Set environment variables
        run: |
          echo "PATH=$CMDLINE_TOOLS:$PATH" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEYSTORE_PATH: ${{ vars.KEYSTORE_PATH }}
          CMDLINE_TOOLS: ${{ vars.CMDLINE_TOOLS }}

      - name: Restore release keystore
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "Error: ANDROID_KEYSTORE_BASE64 is missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "Error: KEY_ALIAS is missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "Error: KEY_PASSWORD is missing"
            exit 1
          }

          test -n "$STORE_PASSWORD" || {
            echo "Error: STORE_PASSWORD is missing"
            exit 1
          }

          test "$KEYSTORE_PATH" = "foxnet-release.p12" || {
            echo "Error: Unexpected KEYSTORE_PATH"
            exit 1
          }

          mkdir -p app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "app/$KEYSTORE_PATH"

          chmod 600 "app/$KEYSTORE_PATH"

          test -s "app/$KEYSTORE_PATH" || {
            echo "Error: Keystore file is empty"
            exit 1
          }

          echo "Release keystore restored successfully"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Print Release Version
        if: github.event_name == 'release'
        run: |
          echo "Release Version: $RELEASE_VERSION"

      # Build signed Debug APKs for development and device testing.
      - name: Build project
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        run: ./gradlew assembleFossDebug

      - name: Run tests
        run: ./gradlew test

      # Collect Debug APKs, which are automatically signed with the Android debug key.
      - name: Collect dev APKs
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        run: |
          mkdir -p dev-apks
          for ARCH in arm64-v8a armeabi-v7a; do
            DEBUG_APK="app/build/outputs/apk/foss/debug/app-foss-${ARCH}-debug.apk"
            if [ -f "$DEBUG_APK" ]; then
              cp -v "$DEBUG_APK" "dev-apks/FoxNet-VPN-${RELEASE_VERSION_NAME}-${ARCH}-debug.apk"
            else
              echo "Error: Debug APK not found for arch $ARCH at $DEBUG_APK"
              exit 1
            fi
          done

      - name: Upload dev APK artifact
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: FoxNet-VPN-dev-${{ env.RELEASE_VERSION_NAME }}
          path: dev-apks/*.apk
          if-no-files-found: error

      - name: Build APK and AAB
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          # APKs from the `foss` flavor (no Google/Firebase) -> sideload / non-GMS devices.
          # AAB from the `gms` flavor (with Firebase) -> Google Play.
          # NOTE: run as two separate Gradle invocations. The Google plugins are applied
          # per-invocation when a task name contains "Gms"; mixing a foss task into the
          # same call would apply them module-wide and leak google-services into foss.
          ./gradlew assembleFossRelease
          ./gradlew bundleGmsRelease

          AAB_FILE=app/build/outputs/bundle/gmsRelease/app-gms-release.aab
          if [ -f "$AAB_FILE" ]; then
            cp -v "$AAB_FILE" "FoxNet-VPN-${RELEASE_VERSION_NAME}.aab"
          else
            echo "Error: AAB file not found at $AAB_FILE"
            exit 1
          fi

          for ARCH in arm64-v8a armeabi-v7a; do
            ABI_APK="app/build/outputs/apk/foss/release/app-foss-${ARCH}-release.apk"
            if [ -f "$ABI_APK" ]; then
              cp -v "$ABI_APK" "FoxNet-VPN-${RELEASE_VERSION_NAME}-${ARCH}.apk"
            else
              echo "Error: APK not found for arch $ARCH at $ABI_APK"
              exit 1
            fi
          done

      - name: Upload APK to Release
        if: github.event_name == 'release'
        uses: AButler/upload-release-assets@v4.0.0
        with:
          files: "FoxNet-VPN-*.apk"
          repo-token: ${{ secrets.CI_TOKEN }}

      - name: Upload AAB to Release
        if: github.event_name == 'release'
        uses: AButler/upload-release-assets@v4.0.0
        with:
          files: "FoxNet-VPN-*.aab"
          repo-token: ${{ secrets.CI_TOKEN }}

      - name: Upload Build Artifacts
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: AndroidArtifacts
          path: |
            FoxNet-VPN-*.apk
            FoxNet-VPN-*.aab
          if-no-files-found: warn
